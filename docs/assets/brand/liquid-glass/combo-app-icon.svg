<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Combo · Liquid Glass</title>
  <desc id="desc">清透蓝色圆角底座上，统一白色玻璃标志融合电量弧、Wi-Fi 和沿圆弧排列的音乐柱体。</desc>
  <metadata>Original Combo SVG artwork, 2026-11-06. Minimal blue and white glass direction. Selected variant D with a simple circular outer arc, stroke width 6; no extended Bezier tails. Music placement and capsule construction follow IconRenderer; heights 16, 23, 19.5, 15.5 preserve D rhythm; music width 5.4 and radius 2.7 follow variant C. No stock or generated imagery.</metadata>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2=".75" y2="1">
      <stop stop-color="#55baff"/><stop offset="1" stop-color="#4279ed"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2=".3" y2="1">
      <stop stop-color="#fff"/><stop offset="1" stop-color="#dfedff"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2=".6" y2="1">
      <stop stop-color="#fff" stop-opacity=".62"/><stop offset="1" stop-color="#fff" stop-opacity=".12"/>
    </linearGradient>
    <filter id="tile-shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#294f8e" flood-opacity=".18"/></filter>
    <filter id="mark-shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy=".65" stdDeviation=".6" flood-color="#1752ac" flood-opacity=".2"/></filter>
    <g id="music">
      <rect x="28.3000" y="64.4000" width="5.4" height="16.0000" rx="2.7"/>
      <rect x="40.3000" y="62.4000" width="5.4" height="23.0000" rx="2.7"/>
      <rect x="54.3000" y="65.9000" width="5.4" height="19.5000" rx="2.7"/>
      <rect x="66.3000" y="64.9000" width="5.4" height="15.5000" rx="2.7"/>
    </g>
    <g id="mark">
      <g fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.6 65 A34 34 0 1 1 79.4 65"/>
        <g stroke-width="5.8">
          <path d="M36 44 Q50 31 64 44"/>
          <path d="M42 51 Q50 43.5 58 51"/>
        </g>
      </g>
      <circle cx="50" cy="57.5" r="2.9" stroke="none"/>
      <use href="#music" stroke="none"/>
    </g>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#base)" filter="url(#tile-shadow)"/>
  <rect x="102" y="102" width="820" height="820" rx="182" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <g transform="translate(100 112) scale(8.24)"><use href="#mark" fill="url(#glass)" stroke="url(#glass)" filter="url(#mark-shadow)"/></g>
</svg>
