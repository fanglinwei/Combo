<style>
#combo-audio-batteries { color-scheme: light dark; --combo-bg: light-dark(#e8e9eb,#2c2d30); --combo-text: light-dark(#24252a,#f4f4f6); --combo-muted: light-dark(#59606b,#b4bac4); --combo-track: light-dark(#c2c5c9,#52555a); --combo-ring-track: light-dark(#a7aab3,#565961); --combo-red: #ff3b41; --combo-yellow: light-dark(#906600,#ffd60a); --combo-green: #28cd50; font: 13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color: var(--combo-text); }
#combo-audio-batteries * { box-sizing: border-box; }
#combo-audio-batteries .scene { min-height: 430px; padding: 28px 14px 32px; display: grid; justify-items: center; align-content: start; gap: 26px; }
#combo-audio-batteries .example { width: min(100%,352px); }
#combo-audio-batteries .caption { margin: 0 0 10px 4px; font-size: 12px; color: var(--combo-muted); font-weight: 400; }
#combo-audio-batteries .surface { background: var(--combo-bg); border-radius: 22px; padding: 20px 24px; box-shadow: 0 5px 16px #00000012; }
#combo-audio-batteries .device { display: flex; align-items: center; gap: 7px; min-width: 0; color: var(--combo-muted); font-size: 12px; }
#combo-audio-batteries .device-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#combo-audio-batteries .glyph { display: inline-block; background: currentColor; width: 18px; height: 22px; mask: var(--glyph) center/contain no-repeat; -webkit-mask: var(--glyph) center/contain no-repeat; flex: none; }
#combo-audio-batteries .volume { display: flex; align-items: center; gap: 12px; }
#combo-audio-batteries .track { height: 5px; flex: 1; background: var(--combo-track); border-radius: 5px; position: relative; }
#combo-audio-batteries .track-fill { width: 31%; height: 100%; border-radius: inherit; background: var(--combo-text); opacity: .85; }
#combo-audio-batteries .thumb { position: absolute; width: 18px; height: 14px; top: -4.5px; left: calc(31% - 9px); border-radius: 8px; background: #fff; box-shadow: 0 1px 4px #00000022; }
#combo-audio-batteries .volume-text { color: var(--combo-muted); font-size: 12px; font-variant-numeric: tabular-nums; }
#combo-audio-batteries .pair { display: flex; align-items: center; justify-content: center; gap: 34px; margin-top: 18px; }
#combo-audio-batteries .gauge { --gauge-size: 44px; --level-color: var(--combo-green); appearance: none; display: grid; place-items: center; position: relative; width: var(--gauge-size); height: var(--gauge-size); padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--combo-text); font: inherit; flex: none; }
#combo-audio-batteries .gauge[data-level=warning] { --level-color: var(--combo-yellow); }
#combo-audio-batteries .gauge[data-level=low] { --level-color: var(--combo-red); }
#combo-audio-batteries .gauge[data-level=unknown] { color: var(--combo-muted); }
#combo-audio-batteries .ring { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#combo-audio-batteries .ring-track { fill: none; stroke: var(--combo-ring-track); stroke-width: 5.7; }
#combo-audio-batteries .ring-value { fill: none; stroke: var(--level-color); stroke-width: 5.7; stroke-linecap: round; transform: rotate(-90deg); transform-origin: center; }
#combo-audio-batteries .gauge > .glyph { grid-area: 1/1; width: 33px; height: 33px; transition: opacity 100ms ease-out; pointer-events: none; }
#combo-audio-batteries .value { grid-area: 1/1; opacity: 0; font-family: ui-rounded,-apple-system,sans-serif; font-size: calc(var(--gauge-size) * .37805); font-weight: 500; font-variant-numeric: tabular-nums; transition: opacity 100ms ease-out; pointer-events: none; }
#combo-audio-batteries .gauge[data-digits="3"] .value { font-size: calc(var(--gauge-size) * .31707); }
#combo-audio-batteries .gauge:is(:hover,:focus-visible,[aria-pressed="true"]) > .glyph { opacity: 0; }
#combo-audio-batteries .gauge:is(:hover,:focus-visible,[aria-pressed="true"]) .value { opacity: 1; }
#combo-audio-batteries .detail .pair { margin-top: 20px; }
#combo-audio-batteries .detail .gauge { --gauge-size: 64px; }
#combo-audio-batteries .detail .gauge > .glyph { width: 48px; height: 48px; }
#combo-audio-batteries .charge-mark { position: absolute; top: calc(var(--gauge-size) * -.109); left: 50%; transform: translateX(-50%); display: grid; place-items: center; width: calc(var(--gauge-size) * .24); height: calc(var(--gauge-size) * .34); pointer-events: none; color: #fff; }
#combo-audio-batteries .charge-mark[hidden] { display: none; }
#combo-audio-batteries .charge-mark::before { content: ""; position: absolute; inset: 0; background: #17151c; mask: var(--bolt-outline) center/contain no-repeat; -webkit-mask: var(--bolt-outline) center/contain no-repeat; }
#combo-audio-batteries .charge-mark .glyph { position: relative; width: 100%; height: 100%; }
#combo-audio-batteries .gauge[data-charge=full] .charge-mark { color: var(--combo-green); }
@media(prefers-reduced-motion:reduce) { #combo-audio-batteries .glyph, #combo-audio-batteries .value { transition: none; } }
@media(prefers-contrast:more) { #combo-audio-batteries .surface { outline: 1px solid var(--combo-muted); } }
#combo-audio-batteries .gauge[data-level=unknown] > .glyph { opacity: 0; }
#combo-audio-batteries .gauge[data-level=unknown] .value { opacity: 1; }
#combo-audio-batteries .device-name { min-width: 0; }
#combo-audio-batteries .gauge:focus-visible { outline: 2px solid var(--combo-text); outline-offset: 4px; }
</style>

  const level = value => value === null ? 'unknown' : value <= 20 ? 'low' : value <= 40 ? 'warning' : 'normal';
  [[null,'unknown'],[0,'low'],[20,'low'],[21,'warning'],[40,'warning'],[41,'normal'],[100,'normal']].forEach(([value,expected]) => { if (level(value) !== expected) throw new Error('电量阈值不匹配'); });
  function setGlyph(element, name) {
    if (!symbols[name]) throw new Error('Missing device symbol: ' + name);
    element.style.setProperty('--glyph', 'url("' + symbols[name] + '")');
  }
  models.forEach(model => {
    const scene = root.querySelector('[data-model="' + model.id + '"] .scene');
    scene.append(exampleTemplate.content.cloneNode(true));
    scene.querySelector('.device-name').textContent = model.name;
    if (model.state) scene.querySelectorAll('.caption').forEach(caption => { caption.textContent = caption.textContent.replace('示例电量', model.state + ' · 示例电量'); });
    setGlyph(scene.querySelector('.model-glyph'),model.icon);
    setGlyph(scene.querySelector('.volume-glyph'),'speaker.wave.2.fill');
    const gauges = [];
    function addGauge(container, item) {
      const gauge = gaugeTemplate.content.firstElementChild.cloneNode(true);
      setGlyph(gauge.querySelector('.glyph'),item.icon);
      setGlyph(gauge.querySelector('.charge-mark .glyph'),'bolt.fill');
      gauge.setAttribute('aria-pressed','false');
      gauge.addEventListener('click', () => gauge.setAttribute('aria-pressed', String(gauge.getAttribute('aria-pressed') !== 'true')));
      container.append(gauge);
      gauges.push({ gauge, item });
    }
    model.items.forEach(item => addGauge(scene.querySelector('.overview .pair'),item));
    model.items.forEach(item => addGauge(scene.querySelector('.detail .pair'),item));
    function render() {
      gauges.forEach(({gauge,item}) => {
        const value = item.value;
        gauge.dataset.level = level(value);
        gauge.dataset.charge = item.charge ?? 'idle';
        gauge.querySelector('.charge-mark').hidden = !item.charge;
        gauge.dataset.digits = String(value).length;
        gauge.querySelector('.value').textContent = value === null ? '—' : String(value);
        const arc = gauge.querySelector('.ring-value');
        arc.setAttribute('stroke-dasharray', (value ?? 0) + ' 100');
        arc.style.opacity = value === null || value === 0 ? '0' : '1';

    }
