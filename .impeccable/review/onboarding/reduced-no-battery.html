&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );

   * @param {object} prototype
   * @param {string} property
   */

    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;

      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);

  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;

  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };

   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },

    globalThis.openai.widgetState = state;

      new CustomEvent(&quot;openai:set_globals&quot;, {

      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());

      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });

    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }

            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();

    { capture: true },
  );

  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }

        target == null ||

#combo-onboarding-glass .og-callout { position: absolute; top: 47px; right: -46px; width: max-content; padding: 9px 13px; border-radius: 12px; background: var(--og-solid); box-shadow: 0 6px 20px var(--og-shadow); font-size: 12px; font-weight: 500; pointer-events: none; }
#combo-onboarding-glass .og-callout::before { content: &quot;&quot;; position: absolute; top: -6px; right: 58px; width: 12px; height: 12px; background: var(--og-solid); transform: rotate(45deg); border-radius: 2px; }
#combo-onboarding-glass .og-window { position: relative; width: min(600px, 100%); margin-top: 78px; border-radius: 24px; background: var(--og-glass); box-shadow: 0 18px 54px var(--og-shadow), inset 0 1px 0 var(--og-rim); backdrop-filter: blur(32px) saturate(1.2); -webkit-backdrop-filter: blur(32px) saturate(1.2); }
#combo-onboarding-glass .og-titlebar { display: flex; align-items: center; height: 41px; padding: 0 19px; }
#combo-onboarding-glass .og-traffic { display: flex; gap: 8px; }
#combo-onboarding-glass .og-traffic i { width: 11px; height: 11px; border-radius: 50%; background: var(--og-red); }
#combo-onboarding-glass .og-traffic i:nth-child(2) { background: var(--og-yellow); }
#combo-onboarding-glass .og-traffic i:nth-child(3) { background: var(--og-window-green); }
#combo-onboarding-glass .og-content { padding: 12px 34px 27px; }
#combo-onboarding-glass .og-heading { display: flex; align-items: center; gap: 13px; }
#combo-onboarding-glass .og-app-icon { width: 48px; height: 48px; flex-shrink: 0; object-fit: contain; }
#combo-onboarding-glass h1 { font-size: 26px; line-height: 1.25; letter-spacing: -.025em; font-weight: 600; text-wrap: balance; }
#combo-onboarding-glass .og-value { margin-top: 22px; font-size: 18px; font-weight: 500; line-height: 1.45; letter-spacing: -.015em; text-wrap: balance; }
#combo-onboarding-glass .og-description { margin-top: 7px; color: var(--og-secondary); max-width: 38em; }
#combo-onboarding-glass .og-example { margin-top: 25px; display: flex; align-items: center; justify-content: flex-end; gap: 15px; min-height: 52px; padding: 9px 16px; border-radius: 12px; background: var(--og-module); }
#combo-onboarding-glass .og-example-label { margin-right: auto; color: var(--og-secondary); font-size: 12px; }
#combo-onboarding-glass .og-example-target { display: flex; align-items: center; gap: 9px; font-size: 12px; font-weight: 500; }
#combo-onboarding-glass .og-example-target .og-mark { width: 27px; height: 27px; padding: 3px; }
#combo-onboarding-glass .og-caption { margin-top: 8px; font-size: 11px; color: var(--og-secondary); }
#combo-onboarding-glass .og-instruction { display: flex; align-items: flex-start; gap: 11px; padding: 23px 0 22px; }
#combo-onboarding-glass .og-instruction-icon { --og-icon: 19px; display: flex; align-items: center; justify-content: center; width: 26px; min-height: 26px; flex-shrink: 0; border-radius: 50%; background: var(--og-module); }
#combo-onboarding-glass .og-instruction h2 { font-size: 14px; line-height: 1.5; font-weight: 600; }
#combo-onboarding-glass .og-instruction p { margin-top: 3px; font-size: 12px; color: var(--og-secondary); }
#combo-onboarding-glass .og-help { border-top: 1px solid var(--og-line); padding-top: 13px; }
#combo-onboarding-glass .og-help summary { width: fit-content; font-size: 12px; padding: 3px 0; }
#combo-onboarding-glass .og-help summary:hover { text-decoration: underline; text-underline-offset: 3px; }
#combo-onboarding-glass .og-help p { margin-top: 8px; color: var(--og-secondary); font-size: 12px; max-width: 37em; }
#combo-onboarding-glass .og-help kbd { font: inherit; font-weight: 500; color: var(--og-label); }
#combo-onboarding-glass .og-footer { display: flex; align-items: center; justify-content: space-between; gap: 22px; margin-top: 22px; }
#combo-onboarding-glass .og-about { font-size: 11px; color: var(--og-secondary); max-width: 26em; text-wrap: pretty; }
#combo-onboarding-glass .og-primary { flex-shrink: 0; min-width: 111px; min-height: 34px; padding: 7px 21px; border-radius: 9px; color: var(--og-on-accent); background: var(--og-accent); font-weight: 500; }
#combo-onboarding-glass .og-primary:hover { filter: brightness(1.1); }
#combo-onboarding-glass .og-popup { position: absolute; top: 43px; right: -46px; width: min(300px, calc(100cqw - 30px)); padding: 17px 19px 16px; border-radius: 26px; background: var(--og-glass); box-shadow: 0 14px 40px var(--og-shadow), inset 0 1px 0 var(--og-rim); backdrop-filter: blur(28px) saturate(1.25); -webkit-backdrop-filter: blur(28px) saturate(1.25); opacity: 0; visibility: hidden; transform: translateY(-6px) scale(.96); transform-origin: calc(100% - 64px) top; filter: blur(2px); transition: transform 240ms cubic-bezier(.16, 1, .3, 1), opacity 140ms ease-out, filter 180ms ease-out, visibility 240ms; }
#combo-onboarding-glass .og-popup[data-open=&quot;true&quot;] { opacity: 1; visibility: visible; transform: translateY(0) scale(1); filter: blur(0); }
#combo-onboarding-glass .og-panel-header { display: flex; align-items: center; justify-content: space-between; font-weight: 600; margin-bottom: 16px; }
#combo-onboarding-glass .og-sample { font-size: 11px; font-weight: 400; color: var(--og-secondary); }
#combo-onboarding-glass .og-media { display: flex; align-items: center; gap: 10px; padding-bottom: 17px; border-bottom: 1px solid var(--og-line); }
#combo-onboarding-glass .og-cover { width: 40px; height: 40px; border-radius: 9px; object-fit: cover; flex-shrink: 0; }
#combo-onboarding-glass .og-track { display: grid; gap: 3px; min-width: 0; }
#combo-onboarding-glass .og-track strong { font-size: 13px; font-weight: 600; }
#combo-onboarding-glass .og-track span { font-size: 11px; color: var(--og-secondary); }
#combo-onboarding-glass .og-media &gt; .og-symbol { margin-left: auto; --og-icon: 14px; }
#combo-onboarding-glass .og-summary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 17px 0; border-bottom: 1px solid var(--og-line); }
#combo-onboarding-glass .og-summary &gt; div + div { padding-left: 17px; border-left: 1px solid var(--og-line); }
#combo-onboarding-glass .og-category { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 500; }
#combo-onboarding-glass .og-color-icon { --og-icon: 16px; width: 23px; height: 23px; border-radius: 7px; display: flex; align-items: center; justify-content: center; color: var(--og-on-color); background: var(--og-green); }
#combo-onboarding-glass .og-color-icon.og-wifi { background: var(--og-blue); }
#combo-onboarding-glass .og-color-icon.og-sound { background: var(--og-purple); }
#combo-onboarding-glass .og-readout { display: block; margin-top: 9px; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
#combo-onboarding-glass .og-readout-note { display: block; margin-top: 3px; color: var(--og-secondary); font-size: 11px; }
#combo-onboarding-glass .og-audio { display: flex; align-items: center; gap: 10px; padding-top: 17px; }
#combo-onboarding-glass .og-audio .og-color-icon { --og-icon: 22px; width: 36px; height: 36px; border-radius: 11px; }
#combo-onboarding-glass .og-audio &gt; div:last-child { display: grid; gap: 3px; }
#combo-onboarding-glass .og-audio strong { font-size: 13px; font-weight: 500; }
#combo-onboarding-glass .og-audio small { color: var(--og-secondary); font-size: 11px; }
#combo-onboarding-glass .og-panel-note { margin-top: 16px; padding-top: 10px; border-top: 1px solid var(--og-line); font-size: 11px; color: var(--og-secondary); }
#combo-onboarding-glass .og-preview-footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding: 12px 4px 0; font-size: 12px; color: var(--og-secondary); }
#combo-onboarding-glass .og-replay { text-decoration: underline; text-underline-offset: 3px; min-height: 30px; }
#combo-onboarding-glass[data-battery=&quot;false&quot;] .og-summary { grid-template-columns: minmax(0, 1fr); }
#combo-onboarding-glass[data-battery=&quot;false&quot;] .og-summary &gt; div + div { border-left: 0; padding-left: 0; }
#combo-onboarding-glass[data-finished=&quot;true&quot;] .og-desktop { min-height: 660px; }
#combo-onboarding-glass[data-reduce-motion=&quot;true&quot;] .og-popup { transition: none; transform: none; filter: none; }
#combo-onboarding-glass[data-reduce-transparency=&quot;true&quot;] :is(.og-window, .og-popup, .og-callout, .og-menubar) { background: var(--og-solid); backdrop-filter: none; -webkit-backdrop-filter: none; }
@media (max-width: 720px) {
  #combo-onboarding-glass .og-desktop { padding: 0 20px 28px; }
  #combo-onboarding-glass .og-menubar { margin: 0 -20px; }
  #combo-onboarding-glass .og-window { margin-top: 81px; }
}
@media (max-width: 430px) {
  #combo-onboarding-glass .og-desktop { padding: 0 10px 20px; }
  #combo-onboarding-glass .og-menubar { margin: 0 -10px; padding: 0 16px; }
  #combo-onboarding-glass .og-menu-left &gt; span { display: none; }
  #combo-onboarding-glass .og-menu-icons { gap: 11px; }
  #combo-onboarding-glass .og-popup { right: -44px; }
  #combo-onboarding-glass .og-callout { right: -44px; }
  #combo-onboarding-glass .og-window { border-radius: 20px; }
  #combo-onboarding-glass .og-titlebar { height: 37px; padding: 0 17px; }
  #combo-onboarding-glass .og-content { padding: 12px 19px 22px; }
  #combo-onboarding-glass .og-app-icon { width: 40px; height: 40px; }
  #combo-onboarding-glass h1 { font-size: 23px; }
  #combo-onboarding-glass .og-value { font-size: 17px; margin-top: 23px; }
  #combo-onboarding-glass .og-example { gap: 13px; padding: 9px 12px; margin-top: 22px; }
  #combo-onboarding-glass .og-example-label { display: none; }
  #combo-onboarding-glass .og-example-target { margin-left: auto; gap: 6px; }
  #combo-onboarding-glass .og-footer { flex-direction: column-reverse; align-items: stretch; gap: 15px; margin-top: 19px; }
  #combo-onboarding-glass .og-about { max-width: none; }
}
@media (pointer: coarse) {
  #combo-onboarding-glass .og-menubar, #combo-onboarding-glass .og-anchor { height: 44px; }
  #combo-onboarding-glass .og-menu-trigger { width: 44px; height: 44px; }
  #combo-onboarding-glass :is(.og-primary, .og-replay, .og-help summary) { min-height: 44px; }
  #combo-onboarding-glass .og-popup { top: 48px; }
  #combo-onboarding-glass .og-callout { top: 53px; }
}
@media (prefers-reduced-motion: reduce) { #combo-onboarding-glass .og-popup { transition: opacity 80ms ease-out; transform: none; filter: none; } }
@media (prefers-reduced-transparency: reduce) { #combo-onboarding-glass :is(.og-window, .og-popup, .og-callout, .og-menubar) { background: var(--og-solid); backdrop-filter: none; -webkit-backdrop-filter: none; } }
@media (prefers-contrast: more) {
  #combo-onboarding-glass { --og-glass: light-dark(#edf1f7, #282e38); --og-secondary: light-dark(#303b49, #e1e7ef); --og-line: light-dark(#737e8d, #8994a5); }
  #combo-onboarding-glass :is(.og-window, .og-popup, .og-callout) { outline: 1px solid var(--og-secondary); }
}

&lt;script&gt;
(() =&gt; {

  const finish = root.querySelector(&#x27;[data-action=&quot;finish&quot;]&#x27;);

    root.dataset.finished = String(state.finished);

    tweak.addToggle(state, &#x27;hasBattery&#x27;, { label: &#x27;设备有内置电池&#x27; });
    tweak.addToggle(state, &#x27;reduceMotion&#x27;, { label: &#x27;减少动态效果&#x27; });
    tweak.addToggle(state, &#x27;reduceTransparency&#x27;, { label: &#x27;减少透明度&#x27; });
  }
})();

    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);

    roots.set(root, () =&gt; {
      observer.disconnect();
      for (const type of Object.keys(handlers)) root.removeEventListener(type, handleEvent);
    });

  };

    closeTooltip(false);
    lastPointerWasTouch = false;
    for (const cleanup of roots.values()) cleanup();
    roots.clear();
    tooltip = null;
  };

&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;

    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;

      return;
    }

      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
